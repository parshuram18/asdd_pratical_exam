# log_analyzer.py

from typing import Tuple

def analyze_log_file(path: str) -> Tuple[int, int, int]:
    """
    Parse a log file and return (info_count, warning_count, error_count).
    Counts lines containing 'ERROR', 'WARNING' (or 'WARN') and 'INFO' (case-insensitive).
    """
    info = warning = error = 0
    with open(path, "r", encoding="utf-8") as fh:
        for line in fh:
            txt = line.upper()
            if "ERROR" in txt:
                error += 1
            elif "WARNING" in txt or "WARN" in txt:
                warning += 1
            elif "INFO" in txt:
                info += 1
    return info, warning, error


def get_health_status(error_count: int) -> str:
    """
    Return 'ATTENTION' if there are errors, otherwise 'NORMAL'.
    """
    return "ATTENTION" if error_count > 0 else "NORMAL"
